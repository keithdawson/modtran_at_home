[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mwir-atmos"
version = "0.1.0"
description = "Mid-wave infrared atmospheric transmittance and radiance calculator (MODTRAN-at-home)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gui = [
    "streamlit>=1.49",
    "plotly>=5.18",
    "matplotlib>=3.7",
]
dev = [
    "pytest>=7.4",
    "pytest-xdist>=3.5",
]
# GPU line-by-line backend (NVIDIA). Blackwell (sm_120) needs CUDA 12.8 or
# newer. `cuda` matches a CUDA 12 driver (the desktop); `cuda13` a CUDA 13
# driver (the work server) and brings its own CUDA runtime, NVRTC and cuBLAS
# wheels -- the only CUDA libraries mwir_atmos uses -- so it does not depend
# on a system toolkit.
cuda = [
    "cupy-cuda12x>=13.4",
]
cuda13 = [
    "cupy-cuda13x>=14.2",
    "cuda-toolkit[cublas,cudart,nvrtc]==13.*",
]

[project.scripts]
mwir = "mwir_atmos.cli:main"

[tool.setuptools.packages.find]
include = ["mwir_atmos*"]

[tool.setuptools.data-files]
"share/mwir-atmos/hitran" = ["data/hitran/*.npz"]
"share/mwir-atmos/aerosol" = ["data/aerosol/*.npz", "data/aerosol/*.json", "data/aerosol/*LICENSE.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"mwir_atmos.optics" = ["AER_LICENSE.txt"]
"mwir_atmos._vendor.pythonic_disort" = ["LICENSE.txt", "provenance.json"]

"mwir_atmos.geometry" = ["refractivity_data/*.yml", "refractivity_data/*.json"]
