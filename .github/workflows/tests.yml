name: Offline physics and GUI verification
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e ".[gui,dev]" wheel
      - run: python -m pytest -q
      - run: python scripts/verify_examples.py
      - run: python -m pip wheel . --no-deps --wheel-dir artifacts/wheel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: |
            artifacts/examples/
            artifacts/wheel/
